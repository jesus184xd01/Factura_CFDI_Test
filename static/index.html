<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Facturación POS (Sandbox)</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:480px;margin:40px auto;padding:0 16px}
  input,button{padding:10px;font-size:16px}
  input{width:60%}
  #msg{margin-top:20px;padding:12px;border-radius:6px;display:none;word-break:break-all}
  .ok{background:#e6f7e9}.err{background:#fde8e8}
</style>
</head>
<body>
<h2>Facturar ticket</h2>
<p><small>Ambiente de pruebas · Receptor: PUBLICO EN GENERAL</small></p>
<input id="ticket" type="number" placeholder="ID de ticket (ej. 1)">
<button id="btn">Facturar</button>
<div id="msg"></div>
<script>
const msg = document.getElementById('msg');
function show(html, ok){ msg.className = ok ? 'ok' : 'err'; msg.innerHTML = html; msg.style.display = 'block'; }
document.getElementById('btn').onclick = async () => {
  const id = document.getElementById('ticket').value;
  if(!id) return show('Ingresa un ID de ticket', false);
  show('Procesando…', true);
  try{
    const r = await fetch('/api/facturar', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({ticket_id:id})});
    const d = await r.json();
    if(!r.ok) return show('Error: ' + d.error + (d.detalle ? '<br><small>' + (d.detalle.message || JSON.stringify(d.detalle)) + '</small>' : ''), false);
    show((d.ya_facturado ? 'Este ticket ya estaba facturado.<br>' : 'Factura emitida.<br>') +
      `UUID: <b>${d.uuid}</b><br>Total: $${d.total}<br>` +
      `<a href="${d.xml_url}" target="_blank">XML</a> · <a href="${d.pdf_url}" target="_blank">PDF</a>`, true);
  }catch(e){ show('Error de red: ' + e.message, false); }
};
</script>
</body>
</html>
